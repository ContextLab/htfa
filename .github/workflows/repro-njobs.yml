name: repro-njobs

on:
  workflow_dispatch:
  push:
    branches: [repro/njobs-openblas]

jobs:
  modes:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: CPU and BLAS
        run: python .github/repro/align_probe.py
      - name: fresh-process fits per mode
        run: python .github/repro/njobs_modes.py 12
