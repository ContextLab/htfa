name: repro-njobs

on:
  workflow_dispatch:
  push:
    branches: [repro/njobs-openblas]

jobs:
  fingerprint:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: CPU
        run: python .github/repro/align_probe2.py
      - name: fingerprint, default
        run: python .github/repro/blas_fingerprint.py 200
      - name: fingerprint, OPENBLAS_CORETYPE=SkylakeX
        run: python .github/repro/blas_fingerprint.py 200
        env:
          OPENBLAS_CORETYPE: SkylakeX
      - name: fingerprint, OPENBLAS_CORETYPE=Haswell
        run: python .github/repro/blas_fingerprint.py 200
        env:
          OPENBLAS_CORETYPE: Haswell
