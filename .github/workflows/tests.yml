name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # off-screen pyvista rendering (htfa.brainnet): Xvfb on Linux, Mesa on Windows
      - uses: pyvista/setup-headless-display-action@v5
      # BrainNet Viewer meshes are downloaded from NITRC on first use; keep them
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/htfa-data
          key: brainnet-meshes-1.43-${{ runner.os }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
        env:
          HTFA_DATA_DIR: ${{ runner.temp }}/htfa-data

  # The lowest versions the dependency floors in pyproject.toml allow.
  min-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@v6
      - run: uv venv .venv
      - run: uv pip install --resolution lowest-direct -e . "pytest>=8" "pillow>=10" "tifffile>=2023.1"
      - run: uv pip list
      - run: .venv/bin/pytest -q tests/test_kernels.py tests/test_engines.py tests/test_synthetic.py tests/test_tfa.py tests/test_htfa.py tests/test_io.py tests/test_connectivity.py
