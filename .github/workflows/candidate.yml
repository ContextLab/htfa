name: release-candidate (no publication)
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  tutorial-data:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ".[nilearn]"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tutorial-inputs
          key: tutorial-inputs-${{ hashFiles('htfa/datasets.py', 'scripts/cache_tutorial_data.py') }}
          restore-keys: tutorial-inputs-
      - name: Download and verify inputs once, before the platform matrix
        run: python scripts/cache_tutorial_data.py "${{ runner.temp }}/tutorial-inputs"
      - uses: actions/upload-artifact@v4
        with:
          name: tutorial-inputs
          path: ${{ runner.temp }}/tutorial-inputs
          compression-level: 0
          retention-days: 7
  wheel:
    needs: tutorial-data
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: pyvista/setup-headless-display-action@v5
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends libegl1 libegl-mesa0
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install the built wheel
        shell: python
        run: |
          import glob, subprocess, sys
          wheel, = glob.glob('dist/*.whl')
          subprocess.run([sys.executable, '-m', 'pip', 'install', wheel + '[dev]'], check=True)
      - uses: actions/download-artifact@v4
        with:
          name: tutorial-inputs
          path: ${{ runner.temp }}/tutorial-inputs
      - name: Verify transferred tutorial input hashes
        run: python scripts/cache_tutorial_data.py "${{ runner.temp }}/tutorial-inputs" --verify
      - run: python scripts/check_installed.py
        env:
          HTFA_DATA_DIR: ${{ runner.temp }}/tutorial-inputs/htfa-data
      - name: Install tutorial dependencies
        shell: python
        run: |
          import glob, subprocess, sys
          wheel, = glob.glob('dist/*.whl')
          subprocess.run([sys.executable, '-m', 'pip', 'install', wheel + '[docs,tutorials]'], check=True)
      - name: Execute all notebooks against the installed wheel
        run: python scripts/check_tutorials.py "${{ runner.temp }}/executed-tutorials"
        env:
          HTFA_DATA_DIR: ${{ runner.temp }}/tutorial-inputs/htfa-data
          HTFA_DATA: ${{ runner.temp }}/tutorial-inputs/htfa-data
          NILEARN_DATA: ${{ runner.temp }}/tutorial-inputs/nilearn-data
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tutorials-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/executed-tutorials/*.ipynb
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*
