name: release-candidate (no publication)
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: pyvista/setup-headless-display-action@v5
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends libegl1 libegl-mesa0
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install the built wheel
        shell: python
        run: |
          import glob, subprocess, sys
          wheel, = glob.glob('dist/*.whl')
          subprocess.run([sys.executable, '-m', 'pip', 'install', wheel + '[dev]'], check=True)
      - run: python scripts/check_installed.py
        env:
          HTFA_DATA_DIR: ${{ runner.temp }}/htfa-data
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*
