[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "htfa"
version = "0.1.0"
description = "Hierarchical Topographic Factor Analysis"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Contextual Dynamics Lab", email = "contextualdynamics@gmail.com" }]
keywords = ["neuroimaging", "factor-analysis", "dimensionality-reduction", "neuroscience", "fmri", "brain-networks"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "nibabel>=5",
  "joblib>=1.3",
  "threadpoolctl>=3",
  "packaging>=21",
  "torch>=2.2; sys_platform=='darwin' and platform_machine=='arm64'",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7", "nilearn>=0.10.1"]
images = ["pillow>=10", "tifffile>=2023.1"]
nilearn = ["nilearn>=0.10.1"]
gpu = ["torch>=2.2"]
brain3d = ["pyvista>=0.43", "imageio>=2.31", "imageio-ffmpeg>=0.4.9", "pillow>=10.1"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
  "mypy>=1.10",
  "build>=1",
  "twine>=5",
  "nilearn>=0.10.1",
  "matplotlib>=3.7",
  "pillow>=10.1",
  "tifffile>=2023.1",
  "pyvista>=0.43",
  "imageio>=2.31",
  "imageio-ffmpeg>=0.4.9",
]
docs = [
  "sphinx>=7",
  "furo",
  "numpydoc",
  "sphinx-gallery",
  "nbsphinx",
  "ipykernel",
  "nbconvert",
  "matplotlib>=3.7",
  "nilearn>=0.10.1",
  "pillow>=10",
  "tifffile>=2023.1",
]

[project.urls]
Homepage = "https://github.com/ContextLab/htfa"
Repository = "https://github.com/ContextLab/htfa"

[tool.setuptools.packages.find]
include = ["htfa*"]

[tool.pytest.ini_options]
testpaths = ["tests", "htfa"]
addopts = "--doctest-modules --strict-markers -m 'not brainiak and not network'"
markers = [
  "brainiak: compares against the reference BrainIAK implementation (requires brainiak)",
  "network: requires network access (downloads data)",
  "gpu: requires a GPU backend (torch with CUDA or MPS)",
  "slow: long-running test",
]

[tool.ruff]
line-length = 88
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY"]

[tool.mypy]
files = ["htfa"]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
